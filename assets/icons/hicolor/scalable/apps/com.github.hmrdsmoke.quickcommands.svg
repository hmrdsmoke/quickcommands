<!-- Placeholder clipboard icon for QuickCommands. Swap for real art later. -->
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <!-- clipboard body -->
  <rect x="28" y="24" width="72" height="88" rx="10" ry="10"
        fill="none" stroke="currentColor" stroke-width="7"/>
  <!-- clip at the top -->
  <rect x="50" y="14" width="28" height="20" rx="6" ry="6"
        fill="currentColor"/>
  <!-- command prompt chevron -->
  <path d="M44 58 L58 70 L44 82" fill="none" stroke="currentColor"
        stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- prompt line -->
  <line x1="66" y1="82" x2="86" y2="82" stroke="currentColor"
        stroke-width="7" stroke-linecap="round"/>
</svg>
